version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to ECR
      - aws --version
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 513691871687.dkr.ecr.us-east-1.amazonaws.com
      - IMAGE_REPO_NAME=employee-service
      - IMAGE_TAG=latest

  build:
    commands:
      - mvn clean package -DskipTests
      - docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG .
      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG 513691871687.dkr.ecr.us-east-1.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG

  post_build:
    commands:
      - docker push 513691871687.dkr.ecr.us-east-1.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
      - printf '{"AWSEBDockerrunVersion":"1","Image":{"Name":"513691871687.dkr.ecr.us-east-1.amazonaws.com/employee-service:latest","Update":"true"},"Ports":[{"ContainerPort":8080}]}' > Dockerrun.aws.json

artifacts:
  files:
    - Dockerrun.aws.json